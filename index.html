<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de unidades y divisas</title>
    <!-- Librería oficial de iconos de banderas en SVG -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icons/7.5.0/css/flag-icons.min.css">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1e40af;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --readonly-bg: #f8fafc;
            --sidebar-bg: #e2e8f0;
            --sidebar-text: #475569;
            --sidebar-hover: #cbd5e1;
        }

        /* Tema Medio */
        [data-theme="medium"] {
            --bg-color: #cbd5e1;
            --card-bg: #f8fafc;
            --text-color: #0f172a;
            --border-color: #94a3b8;
            --readonly-bg: #e2e8f0;
            --sidebar-bg: #94a3b8;
            --sidebar-text: #1e293b;
            --sidebar-hover: #64748b;
        }

        /* Tema Oscuro */
        [data-theme="dark"] {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --readonly-bg: #0f172a;
            --sidebar-bg: #1e293b;
            --sidebar-text: #94a3b8;
            --sidebar-hover: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s;
        }

        /* Barra superior con botones de bandera y selector de tema */
        .top-bar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .language-buttons {
            display: flex;
            gap: 6px;
        }

        .lang-btn {
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 5px 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            background: var(--sidebar-hover);
        }

        .lang-btn.active {
            border-color: var(--primary-color);
            background: var(--card-bg);
            box-shadow: 0 0 0 2px rgba(30, 58, 138, 0.15);
        }

        .lang-btn .fi {
            font-size: 1rem;
            border-radius: 2px;
        }

        .top-bar select {
            padding: 5px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 0.85rem;
        }

        .header {
            background: var(--primary-color);
            color: white;
            padding: 16px 20px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: bold;
        }

        .layout-body {
            display: flex;
            min-height: 480px;
        }

        .sidebar {
            width: 270px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            max-height: 520px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: background-color 0.3s;
        }

        .sidebar-btn {
            background: none;
            border: none;
            padding: 7px 12px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--sidebar-text);
            text-align: left;
            transition: all 0.2s;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-btn:hover {
            background: var(--sidebar-hover);
            color: var(--text-color);
        }

        .sidebar-btn.active {
            background: var(--card-bg);
            color: var(--primary-color);
            border-left: 4px solid var(--primary-color);
        }

        .content-area {
            flex: 1;
            padding: 25px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .converter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .layout-body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                max-height: 180px;
            }
            .converter-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            background: var(--card-bg);
            color: var(--text-color);
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
        }

        input[readonly] {
            background-color: var(--readonly-bg);
            font-weight: bold;
        }

        .footer-actions {
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-secondary {
            background: var(--sidebar-bg);
            color: var(--text-color);
        }
        .btn-secondary:hover { background: var(--sidebar-hover); }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }
        .btn-primary:hover { background: var(--primary-hover); }

        .currency-info {
            font-size: 0.75rem;
            color: var(--sidebar-text);
            margin-top: 10px;
        }
    </style>
</head>
<body>

                "Viscosidade cinemática", "Viscosidade dinâmica"
            ]
        }
    };

    let idiomaActual = "es";

    const datosUnidades = [
        { unidades: ["grado sexagesimal", "radián", "gradián (gon)", "minuto de arco", "segundo de arco"], factores: [1, 57.2957795, 0.9, 0.01666667, 0.000277778] },
        { unidades: ["mm²", "cm²", "dm²", "m²", "in²", "ft²", "yd²", "ac", "ha"], factores: [0.000001, 0.0001, 0.01, 1, 0.00064516, 0.092903, 0.836127, 4046.86, 10000] },
        { unidades: ["m³/h", "m³/s", "L/s", "L/min", "cfm", "gpm"], factores: [1, 3600, 3.6, 0.06, 1.69901, 0.227125] },
        { unidades: ["W/(m·K)", "BTU/(h·ft·°F)", "kcal/(h·m·°C)"], factores: [1, 1.730735, 1.16222] },
        { unidades: ["kg/m³", "g/cm³", "lb/ft³", "lb/in³"], factores: [1, 1000, 16.01846, 27679.9] },
        { unidades: ["kg/m³", "lb/ft³", "g/L"], factores: [1, 16.01846, 1] },
        { unidades: ["kg/m³", "g/cm³", "lb/ft³"], factores: [1, 1000, 16.01846] },
        // Divisas (índice 7)
        { unidades: ["USD - Dólar estadounidense", "EUR - Euro", "GBP - Libra esterlina", "JPY - Yen japonés", "CHF - Franco suizo", "CAD - Dólar canadiense", "AUD - Dólar australiano", "BRL - Real brasileño", "MXN - Peso mexicano"], codigos: ["USD", "EUR", "GBP", "JPY", "CHF", "CAD", "AUD", "BRL", "MXN"], factores: [1, 0.92, 0.79, 155, 0.90, 1.37, 1.52, 5.20, 17.0] },
        { unidades: ["Julio (J)", "kJ", "kWh", "kcal", "BTU"], factores: [1, 1000, 3600000, 4186.8, 1055.06] },
        { unidades: ["kJ/kg", "J/g", "kcal/kg", "BTU/lb"], factores: [1, 1, 4.1868, 2.326] },
        { unidades: ["mm", "cm", "dm", "m", "km", "in", "ft", "yd", "mi"], factores: [0.001, 0.01, 0.1, 1, 1000, 0.0254, 0.3048, 0.9144, 1609.34] },
        { unidades: ["mg", "g", "kg", "t", "long ton", "short ton", "lb", "oz"], factores: [0.000001, 0.001, 1, 1000, 1016.05, 907.185, 0.453592, 0.0283495] },
        { unidades: ["Bytes (B)", "KB", "MB", "GB", "TB"], factores: [1, 1024, 1048576, 1073741824, 1099511627776] },
        { unidades: ["kg", "g", "mg", "µg"], factores: [1, 0.001, 0.000001, 0.000000001] },
        { unidades: ["W", "kW", "BHP", "SHP", "CV/PS"], factores: [1, 1000, 745.7, 745.7, 735.5] },
        { unidades: ["Pa", "kPa", "bar", "psi", "atm", "mmHg", "in.w.g."], factores: [1, 1000, 100000, 6894.76, 101325, 133.322, 248.84] },
        { unidades: ["g_v/kg_a", "kJ/kg_a", "m³/kg_a"], factores: [1, 1, 1] },
        { unidades: ["°C", "K", "°F", "°Ra"], factores: [] },
        { unidades: ["s", "min", "h", "d"], factores: [1, 60, 3600, 86400] },
        { unidades: ["m/s", "nudos / knots", "m/min", "km/h", "ft/s", "fpm", "mph"], factores: [1, 0.514444, 0.0166667, 0.277778, 0.3048, 0.00508, 0.44704] },
        { unidades: ["cSt", "St", "m²/s"], factores: [1, 100, 1000000] },
        { unidades: ["cP", "Pa·s", "P"], factores: [1, 1000, 100] }
    ];

    let pestañaActiva = 0;

    function inicializar() {
        datosUnidades.forEach((cat, index) => {
            const selOrig = document.getElementById(`selOrig${index}`);
            const selDest = document.getElementById(`selDest${index}`);
            if (!selOrig || !selDest) return;

            cat.unidades.forEach((uni, idx) => {
                selOrig.add(new Option(uni, idx));
                selDest.add(new Option(uni, idx));
            });

            if (index === 7) {
                // Forzar por defecto USD en origen y EUR en destino para Divisas
                selOrig.selectedIndex = 0; // USD
                selDest.selectedIndex = 1; // EUR
            } else {
                if (selDest.options.length > 1) selDest.selectedIndex = 1;
            }
        });
        actualizarTextosInterfaz();
        obtenerTiposDeCambioReales();
        calcular(5);
        calcular(7);
    }

    async function obtenerTiposDeCambioReales() {
        try {
            const response = await fetch('https://open.er-api.com/v6/latest/USD');
            const data = await response.json();
            if (data && data.rates) {
                const codigos = datosUnidades[7].codigos;
                datosUnidades[7].factores = codigos.map(code => 1 / data.rates[code]);
                document.getElementById("currencyStatus").innerText = "Tipos de cambio actualizados en tiempo real (" + data.time_last_update_utc.substring(0, 16) + ")";
                calcular(7);
            }
        } catch (error) {
            document.getElementById("currencyStatus").innerText = "Aviso: Usando valores predeterminados por fallo de red al consultar tipos de cambio.";
        }
    }

    function cambiarIdioma(lang) {
        idiomaActual = lang;
        document.querySelectorAll(".lang-btn").forEach(btn => {
            btn.classList.toggle("active", btn.getAttribute("onclick").includes(`'${lang}'`));
        });
        actualizarTextosInterfaz();
    }

    function cambiarTema() {
        const tema = document.getElementById("themeSelect").value;
        if (tema === "light") {
            document.documentElement.removeAttribute("data-theme");
        } else {
            document.documentElement.setAttribute("data-theme", tema);
        }
    }

    function actualizarTextosInterfaz() {
        const t = traducciones[idiomaActual];
        const botones = document.querySelectorAll(".sidebar-btn");
        botones.forEach((btn, idx) => {
            btn.innerText = t.categorias[idx];
        });
        actualizarCabecera(pestañaActiva);
        document.getElementById("btnClear").innerText = t.limpiar;
        document.getElementById("btnClose").innerText = t.cerrar;
        document.querySelectorAll(".lbl-res").forEach(el => el.innerText = t.resultado);
    }

    function actualizarCabecera(index) {
        const t = traducciones[idiomaActual];
        document.getElementById("headerTitle").innerText = `${t.tituloPrefijo} ${t.categorias[index].toLowerCase()}`;
    }

    function switchTab(index) {
        pestañaActiva = index;
        document.querySelectorAll(".sidebar-btn").forEach((btn, idx) => btn.classList.toggle("active", idx === index));
        document.querySelectorAll(".tab-content").forEach((content, idx) => content.classList.toggle("active", idx === index));
        actualizarCabecera(index);
    }

    function calcular(catIndex) {
        const valInput = document.getElementById(`val${catIndex}`);
        const resInput = document.getElementById(`res${catIndex}`);
        const origSelect = document.getElementById(`selOrig${catIndex}`);
        const destSelect = document.getElementById(`selDest${catIndex}`);

        const val = parseFloat(valInput.value);
        if (isNaN(val)) {
            resInput.value = "";
            return;
        }

        const origen = parseInt(origSelect.value);
        const destino = parseInt(destSelect.value);
        let resultado = 0;

        if (catIndex === 17) { // Temperatura
            let enC = val;
            if (origen === 1) enC = val - 273.15;
            else if (origen === 2) enC = (val - 32) * 5 / 9;
            else if (origen === 3) enC = (val - 491.67) * 5 / 9;

            if (destino === 0) resultado = enC;
            else if (destino === 1) resultado = enC + 273.15;
            else if (destino === 2) resultado = (enC * 9 / 5) + 32;
            else if (destino === 3) resultado = (enC + 273.15) * 9 / 5;
        } else {
            const factores = datosUnidades[catIndex].factores;
            const enBase = val * factores[origen];
            resultado = enBase / factores[destino];
        }

        resInput.value = Number(resultado.toFixed(catIndex === 7 ? 4 : 6));
    }

    function limpiar() {
        document.getElementById(`val${pestañaActiva}`).value = "";
        document.getElementById(`res${pestañaActiva}`).value = "";
        document.getElementById(`val${pestañaActiva}`).focus();
    }

    window.onload = inicializar;
</script>
