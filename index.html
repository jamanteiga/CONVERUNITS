<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de unidades y divisas</title>
    <!-- Librería de iconos de banderas SVG -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icons/7.5.0/css/flag-icons.min.css">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1e40af;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --readonly-bg: #f8fafc;
            --sidebar-bg: #e2e8f0;
            --sidebar-text: #475569;
            --sidebar-hover: #cbd5e1;
        }

        [data-theme="medium"] {
            --bg-color: #cbd5e1;
            --card-bg: #f8fafc;
            --text-color: #0f172a;
            --border-color: #94a3b8;
            --readonly-bg: #e2e8f0;
            --sidebar-bg: #94a3b8;
            --sidebar-text: #1e293b;
            --sidebar-hover: #64748b;
        }

        [data-theme="dark"] {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --readonly-bg: #0f172a;
            --sidebar-bg: #1e293b;
            --sidebar-text: #94a3b8;
            --sidebar-hover: #334155;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s;
        }

        .top-bar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .language-buttons {
            display: flex;
            gap: 6px;
        }

        .lang-btn {
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 5px 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .lang-btn:hover {
            background: var(--sidebar-hover);
        }

        .lang-btn.active {
            border-color: var(--primary-color);
            background: var(--card-bg);
            box-shadow: 0 0 0 2px rgba(30, 58, 138, 0.15);
        }

        .lang-btn .fi {
            font-size: 1rem;
            border-radius: 2px;
        }

        .top-bar select {
            padding: 5px 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 0.85rem;
        }

        .close-btn {
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-color);
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
        }

        .header {
            background: var(--primary-color);
            color: white;
            padding: 16px 20px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: bold;
        }

        .layout-body {
            display: flex;
            min-height: 480px;
        }

        .sidebar {
            width: 270px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            max-height: 520px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: background-color 0.3s;
        }

        .sidebar-btn {
            background: none;
            border: none;
            padding: 7px 12px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--sidebar-text);
            text-align: left;
            transition: all 0.2s;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .sidebar-btn:hover {
            background: var(--sidebar-hover);
            color: var(--text-color);
        }

        .sidebar-btn.active {
            background: var(--card-bg);
            color: var(--primary-color);
            border-left: 4px solid var(--primary-color);
        }

        .content-area {
            flex: 1;
            padding: 25px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .converter-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            align-items: center;
        }

        @media (max-width: 768px) {
            .layout-body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                max-height: 180px;
            }
            .converter-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            background: var(--card-bg);
            color: var(--text-color);
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
        }

        input[readonly] {
            background-color: var(--readonly-bg);
            font-weight: bold;
        }

        .footer-actions {
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .btn-secondary {
            background: var(--sidebar-bg);
            color: var(--text-color);
        }
        .btn-secondary:hover { background: var(--sidebar-hover); }

        .currency-info {
            font-size: 0.75rem;
            color: var(--sidebar-text);
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="main-wrapper">

            <button class="lang-btn active" onclick="cambiarIdioma('es')" title="Español"><span class="fi fi-es"></span> ES</button>
            <button class="lang-btn" onclick="cambiarIdioma('gl')" title="Galego"><span class="fi fi-es-ga"></span> GL</button>
            <button class="lang-btn" onclick="cambiarIdioma('en')" title="English"><span class="fi fi-gb"></span> GB</button>

                <div class="tab-content" id="tab-1"><div class="converter-grid"><div class="form-group"><label id="lblInput1" class="lbl-input">Área</label><input type="number" id="val1" oninput="calcular(1)"><select id="selOrig1" onchange="calcular(1)"></select></div><div class="form-group"><label class="lbl-res">Resultado</label><input type="text" id="res1" readonly><select id="selDest1" onchange="calcular(1)"></select></div></div></div>
                <div class="tab-content" id="tab-2"><div class="converter-grid"><div class="form-group"><label id="lblInput2" class="lbl-input">Caudal</label><input type="number" id="val2" oninput="calcular(2)"><select id="selOrig2" onchange="calcular(2)"></select></div><div class="form-group"><label class="lbl-res">Resultado</label><input type="text" id="res2" readonly><select id="selDest2" onchange="calcular(2)"></select></div></div></div>

    function inicializar() {
        const idiomaGuardado = localStorage.getItem('idiomaPrefijo');
        if (idiomaGuardado && traducciones[idiomaGuardado]) {
            idiomaActual = idiomaGuardado;
        }

        poblarSelects();
        actualizarTextosInterfaz();
        obtenerTiposDeCambioReales();
        calcular(5);
        calcular(7);
    }

    function poblarSelects() {
        const t = traducciones[idiomaActual];
        t.unidades.forEach((catUnidades, index) => {
            const selOrig = document.getElementById(`selOrig${index}`);
            const selDest = document.getElementById(`selDest${index}`);
            if (!selOrig || !selDest) return;

            const valOrigPrev = selOrig.value;
            const valDestPrev = selDest.value;

            selOrig.innerHTML = "";
            selDest.innerHTML = "";

            catUnidades.forEach((uni, idx) => {
                selOrig.add(new Option(uni, idx));
                selDest.add(new Option(uni, idx));
            });

            if (valOrigPrev !== "" && valOrigPrev < catUnidades.length) {
                selOrig.selectedIndex = valOrigPrev;
            } else if (index === 7) {
                selOrig.selectedIndex = 0;
            }

            if (valDestPrev !== "" && valDestPrev < catUnidades.length) {
                selDest.selectedIndex = valDestPrev;
            } else if (index === 7) {
                selDest.selectedIndex = 1;
            } else {
                if (selDest.options.length > 1) selDest.selectedIndex = 1;
            }
        });
    }

    async function obtenerTiposDeCambioReales() {
        try {
            const response = await fetch('https://open.er-api.com/v6/latest/USD');
            const data = await response.json();
            if (data && data.rates) {
                factoresComunes[7] = codigosDivisas.map(code => 1 / data.rates[code]);
                const msg = idiomaActual === 'ko' ? "실시간 환율 업데이트 완료 (" : "Tipos de cambio actualizados en tiempo real (";
                document.getElementById("currencyStatus").innerText = msg + data.time_last_update_utc.substring(0, 16) + ")";
                calcular(7);
            }
        } catch (error) {
            const msg = idiomaActual === 'ko' ? "알림: 네트워크 오류로 인해 기본 환율을 사용합니다." : "Aviso: Usando valores de cambio predeterminados por error de red.";
            document.getElementById("currencyStatus").innerText = msg;
        }
    }

        idiomaActual = lang;

        document.querySelectorAll(".lang-btn").forEach(btn => {
            btn.classList.toggle("active", btn.getAttribute("onclick").includes(`'${lang}'`));
        });

        poblarSelects();
        actualizarTextosInterfaz();
        calcular(pestañaActiva);
    }

        const tema = document.getElementById("themeSelect").value;
        if (tema === "light") {
            document.documentElement.removeAttribute("data-theme");
        } else {
            document.documentElement.setAttribute("data-theme", tema);
        }
    }

        window.close();

    function actualizarTextosInterfaz() {
        const t = traducciones[idiomaActual];
        const botones = document.querySelectorAll(".sidebar-btn");
        botones.forEach((btn, idx) => {
            btn.innerText = t.categorias[idx];
            const lblInput = document.getElementById(`lblInput${idx}`);
            if (lblInput) {
                lblInput.innerText = t.categorias[idx];
            }
        });
        actualizarCabecera(pestañaActiva);
        document.getElementById("btnClear").innerText = t.limpiar;
        document.getElementById("btnClose").innerText = t.cerrar;
        
        document.getElementById("optLight").innerText = idiomaActual === 'ko' ? '밝게' : 'Claro';
        document.getElementById("optMedium").innerText = idiomaActual === 'ko' ? '중간' : 'Medio';
        document.getElementById("optDark").innerText = idiomaActual === 'ko' ? '어둡게' : (idiomaActual === 'pt' ? 'Escuro' : (idiomaActual === 'gl' ? 'Escuro' : 'Oscuro'));
    }

    function actualizarCabecera(index) {
        const t = traducciones[idiomaActual];
        if (idiomaActual === 'ko') {
            document.getElementById("headerTitle").innerText = `${t.categorias[index]} ${t.tituloPrefijo}`;
        } else {
            document.getElementById("headerTitle").innerText = `${t.tituloPrefijo} ${t.categorias[index].toLowerCase()}`;
        }
    }

    function switchTab(index) {
        pestañaActiva = index;
        document.querySelectorAll(".sidebar-btn").forEach((btn, idx) => btn.classList.toggle("active", idx === index));
        document.querySelectorAll(".tab-content").forEach((content, idx) => content.classList.toggle("active", idx === index));
        actualizarCabecera(index);
    }

    function calcular(catIndex) {
        const valInput = document.getElementById(`val${catIndex}`);
        const resInput = document.getElementById(`res${catIndex}`);
        const origSelect = document.getElementById(`selOrig${catIndex}`);
        const destSelect = document.getElementById(`selDest${catIndex}`);

        const val = parseFloat(valInput.value);
        if (isNaN(val)) {
            resInput.value = "";
            return;
        }

        const origen = parseInt(origSelect.value);
        const destino = parseInt(destSelect.value);
        let resultado = 0;

        if (catIndex === 17) {
            let enC = val;
            if (origen === 1) enC = val - 273.15;
            else if (origen === 2) enC = (val - 32) * 5 / 9;
            else if (origen === 3) enC = (val - 491.67) * 5 / 9;

            if (destino === 0) resultado = enC;
            else if (destino === 1) resultado = enC + 273.15;
            else if (destino === 2) resultado = (enC * 9 / 5) + 32;
            else if (destino === 3) resultado = (enC + 273.15) * 9 / 5;
        } else {
            const factores = factoresComunes[catIndex];
            const enBase = val * factores[origen];
            resultado = enBase / factores[destino];
        }

        resInput.value = Number(resultado.toFixed(catIndex === 7 ? 4 : 6));
    }

    function limpiar() {
        document.getElementById(`val${pestañaActiva}`).value = "";
        document.getElementById(`res${pestañaActiva}`).value = "";
        document.getElementById(`val${pestañaActiva}`).focus();
    }
