<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Conversor de unidades y divisas</title>
    <meta name="theme-color" content="#1e3a8a" id="metaTheme">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Conversor">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <!-- Librería de iconos de banderas SVG -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icons/7.5.0/css/flag-icons.min.css">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1e40af;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
            --readonly-bg: #f8fafc;
            --sidebar-bg: #e2e8f0;
            --sidebar-text: #475569;
            --sidebar-hover: #cbd5e1;
            --fs: 1;
        }

        [data-theme="medium"] {
            --bg-color: #cbd5e1;
            --card-bg: #f8fafc;
            --text-color: #0f172a;
            --border-color: #94a3b8;
            --readonly-bg: #e2e8f0;
            --sidebar-bg: #94a3b8;
            --sidebar-text: #1e293b;
            --sidebar-hover: #64748b;
        }

        [data-theme="dark"] {
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --readonly-bg: #0f172a;
            --sidebar-bg: #1e293b;
            --sidebar-text: #94a3b8;
            --sidebar-hover: #334155;
        }

        * { box-sizing: border-box; }

        html {
            background-color: var(--bg-color);
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s;
            zoom: var(--fs);
        }

        .safe-top { display: none; background: var(--primary-color); }

        .top-bar {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.85rem;
        }

        .top-bar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .language-buttons { display: flex; flex-wrap: wrap; gap: 6px; }

        .lang-btn {
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 5px 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
            font-family: inherit;
        }
        .lang-btn:hover { background: var(--sidebar-hover); }
        .lang-btn.active { border-color: var(--primary-color); background: var(--card-bg); box-shadow: 0 0 0 2px rgba(30, 58, 138, 0.15); }
        .lang-btn .fi { font-size: 1rem; border-radius: 2px; }

        .top-bar select {
            padding: 5px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 0.85rem;
        }

        .close-btn, .mini-btn {
            background: var(--sidebar-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-color);
            transition: all 0.2s;
            font-family: inherit;
        }
        .mini-btn { padding: 4px 8px; }
        .mini-btn:hover { background: var(--sidebar-hover); }
        .close-btn:hover { background: #ef4444; color: white; border-color: #ef4444; }

        .header {
            background: var(--primary-color);
            color: white;
            padding: 16px 52px;
            text-align: center;
            font-size: 1.15rem;
            font-weight: bold;
            position: relative;
        }
        .fav-cat {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; line-height: 1; padding: 4px 8px;
        }

        .cat-select-wrap { display: none; padding: 12px 16px 0; }

        .layout-body { display: flex; min-height: 480px; }

        .sidebar {
            width: 270px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            max-height: 640px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: background-color 0.3s;
        }

        .sidebar-btn {
            background: none;
            border: none;
            padding: 7px 12px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--sidebar-text);
            text-align: left;
            transition: all 0.2s;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: inherit;
        }
        .sidebar-btn { flex-shrink: 0; }
        .sidebar-btn.sub { padding-left: 28px; font-weight: 500; }
        .sidebar-btn.fav { color: var(--primary-color); }
        .sidebar-btn:hover { background: var(--sidebar-hover); color: var(--text-color); }
        .sidebar-btn.active { background: var(--card-bg); color: var(--primary-color); border-left: 4px solid var(--primary-color); }

        .content-area {
            flex: 1;
            min-width: 0;
            padding: 25px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .converter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: center; }

        .form-group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }

        label { font-weight: 600; font-size: 0.9rem; }

        input, select {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            background: var(--card-bg);
            color: var(--text-color);
            transition: border-color 0.2s;
            min-width: 0;
        }
        input:focus, select:focus { border-color: var(--primary-color); box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); }
        input[readonly] { background-color: var(--readonly-bg); font-weight: bold; }
        input.bad { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15); }

        .footer-actions {
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
            transition: background 0.2s;
        }
        .btn-secondary { background: var(--sidebar-bg); color: var(--text-color); }
        .btn-secondary:hover { background: var(--sidebar-hover); }

        .actions-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
        .actions-row .btn { padding: 8px 14px; font-size: 0.82rem; }

        .trace, .note, .currency-info { font-size: 0.78rem; color: var(--sidebar-text); line-height: 1.5; margin-top: 12px; }

        /* Desplegables */
        details.all { margin-top: 18px; border: 1px solid var(--border-color); border-radius: 8px; }
        details.all summary { padding: 10px 14px; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: var(--sidebar-text); }
        .all-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 0 18px; padding: 4px 14px 12px; }
        .all-item { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--border-color); font-size: 0.82rem; }
        .all-item .n { color: var(--sidebar-text); }
        .all-item .v { font-weight: 700; text-align: right; word-break: break-all; }
        .panel-body { padding: 4px 14px 14px; }
        .panel-body h4 { margin: 10px 0 6px; font-size: 0.8rem; color: var(--sidebar-text); text-transform: uppercase; letter-spacing: .04em; }
        .chips { display: flex; flex-direction: column; gap: 4px; }
        .chip-row { display: flex; gap: 6px; }
        .chip { flex: 1; text-align: left; background: var(--readonly-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 7px 10px; font-size: 0.8rem; color: var(--text-color); cursor: pointer; font-family: inherit; }
        .chip:hover { border-color: var(--primary-color); }
        .chip-x { border: 1px solid var(--border-color); background: var(--card-bg); border-radius: 6px; width: 34px; cursor: pointer; color: var(--sidebar-text); }
        .empty { font-size: 0.8rem; color: var(--sidebar-text); }

        /* Presión: referencia */
        .presref { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 16px; padding: 12px; border: 1px dashed var(--border-color); border-radius: 8px; }
        .fg { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

        /* Calculadoras */
        .calc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px 18px; }
        .calc-grid .wide { grid-column: 1 / -1; }
        .out-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 0 22px; margin-top: 18px; border: 1px solid var(--border-color); border-radius: 8px; padding: 6px 14px; background: var(--readonly-bg); }
        .out-item { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--border-color); font-size: 0.88rem; }
        .out-item .n { color: var(--sidebar-text); }
        .out-item .v { font-weight: 700; text-align: right; }
        .two { display: grid; grid-template-columns: 1fr 140px; gap: 8px; align-items: end; }

        /* Pulgadas / pies */
        fieldset.adjust { border: 1px solid var(--border-color); border-radius: 8px; margin: 0 0 18px; padding: 6px 12px 10px; }
        fieldset.adjust legend { font-weight: 700; font-size: 0.85rem; padding: 0 6px; }
        .radios { display: flex; flex-wrap: wrap; gap: 6px 14px; }
        .radios label { font-weight: 500; font-size: 0.88rem; display: flex; align-items: center; gap: 5px; cursor: pointer; padding: 4px 0; }
        .radios input[type=radio] { padding: 0; width: 18px; height: 18px; accent-color: var(--primary-color); }
        .imp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .box { border: 1px solid var(--border-color); border-radius: 8px; padding: 14px 16px 16px; background: var(--readonly-bg); }
        .box h3 { margin: 0 0 12px; text-align: center; font-size: 1.05rem; }
        .imp-fields { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
        .imp-fields .fg { flex: 1 1 70px; }
        .frac { display: flex; flex-direction: column; align-items: stretch; gap: 3px; }
        .frac .bar { height: 2px; background: var(--text-color); opacity: .55; }
        .frac input { text-align: center; }
        .nav { display: flex; gap: 10px; margin-top: 14px; }
        .nav .btn { flex: 1; padding: 10px 8px; }
        .out-units { margin-top: 12px; }

        /* Zapatos */
        .shoe-wrap { overflow-x: auto; }
        h3.sec { font-size: 0.95rem; margin: 22px 0 10px; color: var(--primary-color); }
        table.dt td { font-variant-numeric: tabular-nums; }
        .at-sum { font-weight: 700; margin: 14px 0; font-size: 1rem; }
        table.shoes { width: 100%; border-collapse: collapse; font-size: 0.9rem; text-align: center; }
        table.shoes th, table.shoes td { border: 1px solid var(--border-color); padding: 8px 6px; }
        table.shoes thead th { background: var(--primary-color); color: #fff; font-size: 0.8rem; }
        table.shoes tbody th { font-size: 1rem; color: var(--primary-color); background: var(--readonly-bg); }
        table.shoes tbody tr { cursor: pointer; }
        table.shoes tbody tr.sel td, table.shoes tbody tr.sel th { background: rgba(59, 130, 246, 0.22); font-weight: 700; }

        /* Barra de teclas (solo táctil) */
        .keybar { display: none; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
        .keybar button { flex: 1 1 36px; min-height: 40px; border: 1px solid var(--border-color); background: var(--sidebar-bg); color: var(--text-color); border-radius: 6px; font-size: 1rem; font-weight: 700; font-family: inherit; }

        @media (max-width: 768px) {
            body { padding: 0; display: block; min-height: 100dvh; }
            .main-wrapper { max-width: none; border-radius: 0; box-shadow: none; min-height: 100vh; min-height: calc(100dvh / var(--fs)); }
            .safe-top { display: block; order: -2; height: env(safe-area-inset-top, 0px); }
            .header { order: -1; padding: 14px 48px; font-size: 1.05rem; }
            .top-bar { padding: 8px 12px; }
            .lang-btn { padding: 8px 10px; min-height: 38px; }
            .top-bar select { font-size: 16px; padding: 8px 8px; }
            .close-btn, .mini-btn { padding: 8px 12px; }
            .sidebar { display: none; }
            .cat-select-wrap { display: block; }
            .cat-select-wrap select { width: 100%; font-size: 16px; font-weight: 600; padding: 12px; min-height: 46px; }
            .layout-body { flex-direction: column; min-height: 0; }
            .content-area { padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right)); }
            .converter-grid, .imp-grid { grid-template-columns: 1fr; gap: 16px; }
            input, select { font-size: 16px; padding: 12px; min-height: 46px; }
            .btn { min-height: 46px; font-size: 1rem; }
            .actions-row .btn { min-height: 42px; font-size: 0.9rem; flex: 1 1 140px; }
            .footer-actions .btn { width: 100%; }
            .all-grid, .out-grid, .calc-grid { grid-template-columns: 1fr; }
            .radios { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 2px 8px; }
            .radios input[type=radio] { width: 22px; height: 22px; min-height: 0; padding: 0; }
            .radios label { padding: 6px 0; font-size: 0.95rem; }
            table.shoes { font-size: 0.85rem; }
            table.shoes th, table.shoes td { padding: 9px 4px; }
        }

        @media (display-mode: standalone), (hover: none) { .close-btn { display: none; } }
        /* Solo escritorio: menú lateral más holgado */
        @media (min-width: 769px) {
            .sidebar { width: 330px; max-height: 720px; }
            .sidebar-btn { padding: 11px 16px; font-size: 0.92rem; line-height: 1.35; }
            .sidebar-btn.sub { padding-left: 32px; }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="safe-top"></div>

    <div class="top-bar">
        <div class="language-buttons">
            <button class="lang-btn" data-lang="ko" title="한국어"><span class="fi fi-kr"></span> KR</button>
            <button class="lang-btn active" data-lang="es" title="Español"><span class="fi fi-es"></span> ES</button>
            <button class="lang-btn" data-lang="gl" title="Galego"><span class="fi fi-es-ga"></span> GL</button>
            <button class="lang-btn" data-lang="en" title="English"><span class="fi fi-gb"></span> GB</button>
            <button class="lang-btn" data-lang="pt" title="Português (Brasil)"><span class="fi fi-br"></span> BR</button>

        <div class="top-bar-right">
            <select id="fmtSelect" aria-label="Formato">
                <option value="auto" data-t="fmtAuto"></option>
                <option value="d2" data-t="fmtD2"></option>
                <option value="d3" data-t="fmtD3"></option>
                <option value="d4" data-t="fmtD4"></option>
                <option value="d6" data-t="fmtD6"></option>
                <option value="sci" data-t="fmtSci"></option>

            <button class="mini-btn" id="fsDown" title="A−" aria-label="A−">A−</button>
            <button class="mini-btn" id="fsUp" title="A+" aria-label="A+">A+</button>
            <select id="themeSelect" aria-label="Tema">
                <option value="light" id="optLight" selected>Claro</option>
                <option value="medium" id="optMedium">Medio</option>
                <option value="dark" id="optDark">Oscuro</option>
                <option value="auto" id="optAuto" data-t="temaAuto"></option>
            </select>
            <button class="close-btn" id="btnClose">Cerrar</button>
        </div>
    </div>

    <div class="header"><span id="headerTitle"></span><button class="fav-cat" id="btnFavCat" aria-label="★">☆</button></div>

    <div class="cat-select-wrap"><select id="catSelect" aria-label="Categoría"></select></div>

    <div class="layout-body">
        <div class="sidebar" id="sidebarMenu"></div>

        <div class="content-area">
            <div>
                <div id="tabs"></div>
                <details class="all" id="histPanel">
                    <summary data-t="historial"></summary>
                    <div class="panel-body" id="histBody"></div>
                </details>
            </div>
            <div class="footer-actions" id="footerActions">
                <button class="btn btn-secondary" id="btnClear">Limpiar</button>
            </div>
        </div>
    </div>
</div>

    /* ===================== FORMATO NUMÉRICO / EXPRESIONES ===================== */
    const FMT = { mode: 'auto', dec: 0 };
    function loc(s) { return LANGS_COMMA.indexOf(lang) >= 0 ? s.replace('.', ',') : s; }
    function fmtNum(x, dec4) {
        if (!isFinite(x)) return '';
        let s;
        if (FMT.mode === 'sci') {
            s = x.toExponential(FMT.dec || 4);
        } else if (FMT.mode === 'dec') {
            if (x !== 0 && (Math.abs(x) < Math.pow(10, -FMT.dec) || Math.abs(x) >= 1e15)) s = x.toExponential(Math.max(FMT.dec, 2));
            else s = x.toFixed(FMT.dec);
        } else {
            s = String(Number(dec4 ? x.toFixed(4) : x.toPrecision(10)));
        }
        return loc(s);
    }
    function rawStr(x) { return loc(String(Number(x.toPrecision(12)))); }

    function parseExpr(str) {
        if (str === null || str === undefined) return NaN;
        let s = String(str).trim();
        if (s === '') return NaN;
        s = s.replace(/,/g, '.').replace(/[×x·]/g, '*').replace(/÷/g, '/').replace(/[−–]/g, '-');
        s = s.replace(/(\d+(?:\.\d+)?)\s+(\d+)\s*\/\s*(\d+)/g, '($1+$2/$3)');   // fracción mixta: 1 3/8
        if (/\d\s+\d/.test(s)) return NaN;
        s = s.replace(/\s+/g, '');
        let i = 0;
        const numRe = /^(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/i;
        function expr() {
            let v = term();
            while (i < s.length && (s[i] === '+' || s[i] === '-')) { const op = s[i++]; const r = term(); v = op === '+' ? v + r : v - r; }
            return v;
        }
        function term() {
            let v = unary();
            while (i < s.length && (s[i] === '*' || s[i] === '/')) { const op = s[i++]; const r = unary(); v = op === '*' ? v * r : v / r; }
            return v;
        }
        function unary() {
            if (s[i] === '-') { i++; return -unary(); }
            if (s[i] === '+') { i++; return unary(); }
            return pow();
        }
        function pow() {
            const b = atom();
            if (s[i] === '^') { i++; return Math.pow(b, unary()); }
            return b;
        }
        function atom() {
            if (s[i] === '(') { i++; const v = expr(); if (s[i] !== ')') throw 0; i++; return v; }
            const m = numRe.exec(s.slice(i));
            if (!m) throw 0;
            i += m[0].length;
            return parseFloat(m[0]);
        }
        try {
            const v = expr();
            if (i !== s.length || !isFinite(v)) return NaN;
            return v;
        } catch (e) { return NaN; }
    }
    const V = el => parseExpr(el.value);
    const numOf = el => { const v = V(el); return isNaN(v) ? 0 : v; };
    function markBad(el) { const s = el.value.trim(); el.classList.toggle('bad', s !== '' && isNaN(parseExpr(s))); }
    const setO = (el, x) => { el.value = isFinite(x) ? fmtNum(x) : ''; el.classList.remove('bad'); };

    const O = (v, key) => '<option value="' + v + '" data-t="' + key + '"></option>';
    const OUT = (id, key) => '<div class="out-item"><span class="n" data-t="' + key + '"></span><span class="v" id="' + id + '"></span></div>';

    /* ===================== CÁLCULO GENÉRICO ===================== */
    const toBase = (un, v) => un.inv ? 1 / (v * un.f) : v * un.f;
    const fromBase = (un, b) => un.inv ? 1 / (b * un.f) : b / un.f;
    function conv(c, v, i, j) {
        if (c.id === 'temperatura') {
            const C = i === 0 ? v : i === 1 ? v - 273.15 : i === 2 ? (v - 32) * 5 / 9 : (v - 491.67) * 5 / 9;
            return j === 0 ? C : j === 1 ? C + 273.15 : j === 2 ? C * 9 / 5 + 32 : (C + 273.15) * 9 / 5;
        }
        let b = toBase(c.units[i], v);
        if (c.id === 'presion' && c.pref) {
            if (c.pref.ro === 'rel') b += c.pref.atm * 1000;
            if (c.pref.rd === 'rel') b -= c.pref.atm * 1000;
        }
        return fromBase(c.units[j], b);
    }

    function calcular(c) {
        const val = $('val-' + c.id), res = $('res-' + c.id), grid = $('all-' + c.id);
        markBad(val);
        const v = parseExpr(val.value);
        const o = parseInt($('so-' + c.id).value), d = parseInt($('sd-' + c.id).value);
        actualizarTraza(c, o, d);
        if (isNaN(v)) {
            res.value = ''; c.lastRes = undefined;
            Array.from(grid.children).forEach(it => it.lastChild.textContent = '');
            return;
        }
        if (c.id === 'presion') c.pref = { ro: $('pr-o').value, rd: $('pr-d').value, atm: V($('pr-atm')) || 101.325 };
        const dec4 = c.id === 'divisas';
        const r = conv(c, v, o, d);
        c.lastRes = r;
        res.value = fmtNum(r, dec4);
        c.units.forEach((_, j) => { grid.children[j].lastChild.textContent = fmtNum(conv(c, v, o, j), dec4); });
    }

    function actualizarTraza(c, o, d) {
        const el = $('trace-' + c.id);
        if (!el) return;
        let txt;
        if (c.id === 'temperatura') txt = 'K = °C + 273,15  ·  °F = °C × 9/5 + 32  ·  °Ra = K × 9/5';
        else if (c.units[o].inv || c.units[d].inv) txt = 'R = 1 / U';
        else txt = tx('factor') + ': 1 ' + nm(c.units[o].n, lang) + ' = ' + fmtNum(c.units[o].f / c.units[d].f) + ' ' + nm(c.units[d].n, lang);
        if (c.src) txt += '   ·   ' + tx('referencia') + ': ' + c.src;
        el.textContent = txt;
    }

    /* ===================== CONSTRUCCIÓN: GENÉRICO ===================== */
    function buildGeneric(c) {
        const div = document.createElement('div');
        div.className = 'tab-content';
        div.id = 'tab-' + c.id;
        div.innerHTML =
            '<div class="converter-grid">' +
              '<div class="form-group"><label data-cat="' + c.id + '" for="val-' + c.id + '"></label>' +
                '<input class="num" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" id="val-' + c.id + '"' + (c.def !== undefined ? ' value="' + c.def + '"' : '') + '>' +
                '<select id="so-' + c.id + '"></select></div>' +
              '<div class="form-group"><label data-t="nRes" for="res-' + c.id + '"></label>' +
                '<input type="text" id="res-' + c.id + '" readonly>' +
                '<select id="sd-' + c.id + '"></select></div>' +
            '</div>' +
            '<div class="actions-row"><button type="button" class="btn btn-secondary" id="swap-' + c.id + '" data-t="swap"></button>' +
              '<button type="button" class="btn btn-secondary" id="copy-' + c.id + '" data-t="copiar"></button>' +
              '<button type="button" class="btn btn-secondary" id="favp-' + c.id + '"></button></div>' +
            (c.id === 'presion' ?
              '<div class="presref">' + S('pr-o', 'presOrigen', O('abs', 'presAbs') + O('rel', 'presRel')) + S('pr-d', 'presDestino', O('abs', 'presAbs') + O('rel', 'presRel')) + F('pr-atm', 'presAtm', '101.325') + '</div>' : '') +
            '<div class="trace" id="trace-' + c.id + '"></div>' +
            '<details class="all"><summary data-i="todas"></summary><div class="all-grid" id="all-' + c.id + '"></div></details>' +
            (c.id === 'divisas' ? '<div class="currency-info" id="currencyStatus"></div>' +
              '<details class="all" id="manualPanel"><summary data-t="divManual"></summary><div class="panel-body">' +
              '<label class="radios"><span style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="mr-use" style="width:20px;height:20px;min-height:0;padding:0"><span data-t="divUsar"></span></span></label>' +
              '<div class="calc-grid" id="mr-grid" style="margin-top:10px"></div></div></details>' : '');
        const grid = div.querySelector('.all-grid');
        c.units.forEach(() => {
            const it = document.createElement('div');
            it.className = 'all-item';
            it.innerHTML = '<span class="n"></span><span class="v"></span>';
            grid.appendChild(it);
        });
        $('tabs').appendChild(div);

        const fn = () => calcular(c);
        $('val-' + c.id).addEventListener('input', () => { calcular(c); scheduleHist(c); });
        ['so-', 'sd-'].forEach(p => $(p + c.id).addEventListener('change', () => { calcular(c); scheduleHist(c); actualizarFavBtn(c); }));
        if (c.id === 'presion') ['pr-o', 'pr-d'].forEach(id => $(id).addEventListener('change', fn)), $('pr-atm').addEventListener('input', () => { markBad($('pr-atm')); fn(); });

        $('swap-' + c.id).addEventListener('click', () => {
            const so = $('so-' + c.id), sd = $('sd-' + c.id);
            const i = so.selectedIndex, j = sd.selectedIndex, prev = c.lastRes;
            so.selectedIndex = j; sd.selectedIndex = i;
            if (prev !== undefined && isFinite(prev)) $('val-' + c.id).value = rawStr(prev);
            calcular(c); scheduleHist(c); actualizarFavBtn(c);
        });
        $('copy-' + c.id).addEventListener('click', () => copiar($('res-' + c.id).value, $('copy-' + c.id)));
        $('favp-' + c.id).addEventListener('click', () => {
            const p = { c: c.id, o: $('so-' + c.id).selectedIndex, d: $('sd-' + c.id).selectedIndex };
            let favs = LS.getJ('favPares', []);
            const k = favs.findIndex(x => x.c === p.c && x.o === p.o && x.d === p.d);
            if (k >= 0) favs.splice(k, 1); else favs.unshift(p);
            LS.setJ('favPares', favs);
            actualizarFavBtn(c); renderHist();
        });
    }

    function poblarSelects(c) {
        ['so-', 'sd-'].forEach((pref, k) => {
            const sel = $(pref + c.id);
            const prev = sel.options.length ? sel.selectedIndex : -1;
            sel.innerHTML = '';
            c.units.forEach((un, idx) => sel.add(new Option(nm(un.n, lang), idx)));
            if (prev >= 0) sel.selectedIndex = prev;
            else sel.selectedIndex = k === 0 ? (c.o !== undefined ? c.o : 0) : (c.d !== undefined ? c.d : 1);
        });
        const grid = $('all-' + c.id);
        c.units.forEach((un, j) => { grid.children[j].firstChild.textContent = nm(un.n, lang); });
    }

    function copiar(text, btn) {
        if (!text) return;
        const done = () => { const prev = btn.textContent; btn.textContent = tx('copiado'); setTimeout(() => { btn.textContent = tx('copiar'); }, 1200); };
        try {
            if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, () => fallback()); return; }
        } catch (e) { }
        fallback();
        function fallback() {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.focus(); ta.select();
            try { document.execCommand('copy'); } catch (e) { }
            document.body.removeChild(ta); done();
        }
    }

    /* ===================== HISTORIAL Y FAVORITOS ===================== */
    let histTimer = null;
    function scheduleHist(c) {
        clearTimeout(histTimer);
        histTimer = setTimeout(() => {
            const v = $('val-' + c.id).value.trim(), r = $('res-' + c.id).value;
            if (!v || !r || isNaN(parseExpr(v))) return;
            const e = { c: c.id, o: $('so-' + c.id).selectedIndex, d: $('sd-' + c.id).selectedIndex, v, r };
            let h = LS.getJ('hist', []).filter(x => !(x.c === e.c && x.o === e.o && x.d === e.d && x.v === e.v));
            h.unshift(e);
            LS.setJ('hist', h.slice(0, 20));
            renderHist();
        }, 1500);
    }
    function aplicarEntrada(c, o, d, v) {
        switchTab(c);
        const cat = byId[c];
        if (!cat || !cat.units) return;
        $('so-' + c).selectedIndex = o; $('sd-' + c).selectedIndex = d;
        if (v !== undefined) $('val-' + c).value = v;
        calcular(cat); actualizarFavBtn(cat);
    }
    function renderHist() {
        const body = $('histBody');
        const favs = LS.getJ('favPares', []).filter(p => byId[p.c] && byId[p.c].units && byId[p.c].units[p.o] && byId[p.c].units[p.d]);
        const hist = LS.getJ('hist', []).filter(p => byId[p.c] && byId[p.c].units && byId[p.c].units[p.o] && byId[p.c].units[p.d]);
        body.innerHTML = '';
        const sec = (title, items, mk, onDel) => {
            const h = document.createElement('h4'); h.textContent = title; body.appendChild(h);
            const wrap = document.createElement('div'); wrap.className = 'chips';
            if (!items.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = tx('vacio'); wrap.appendChild(e); }
            items.forEach((it, idx) => {
                const row = document.createElement('div'); row.className = 'chip-row';
                const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.textContent = mk(it);
                b.addEventListener('click', () => aplicarEntrada(it.c, it.o, it.d, it.v));
                row.appendChild(b);
                if (onDel) { const x = document.createElement('button'); x.type = 'button'; x.className = 'chip-x'; x.textContent = '×'; x.addEventListener('click', () => onDel(idx)); row.appendChild(x); }
                wrap.appendChild(row);
            });
            body.appendChild(wrap);
        };
        sec(tx('paresFav'), favs, p => nm(byId[p.c].n, lang) + ':  ' + nm(byId[p.c].units[p.o].n, lang) + ' → ' + nm(byId[p.c].units[p.d].n, lang),
            idx => { const all = LS.getJ('favPares', []); const t = favs[idx]; const k = all.findIndex(x => x.c === t.c && x.o === t.o && x.d === t.d); if (k >= 0) all.splice(k, 1); LS.setJ('favPares', all); renderHist(); if (isGeneric(byId[activa])) actualizarFavBtn(byId[activa]); });
        sec(tx('hist'), hist, p => p.v + ' ' + nm(byId[p.c].units[p.o].n, lang) + ' = ' + p.r + ' ' + nm(byId[p.c].units[p.d].n, lang), null);
        if (hist.length) {
            const b = document.createElement('button'); b.type = 'button'; b.className = 'btn btn-secondary'; b.style.marginTop = '10px'; b.textContent = tx('borrarHist');
            b.addEventListener('click', () => { LS.setJ('hist', []); renderHist(); });
            body.appendChild(b);
        }
    }
    function actualizarFavBtn(c) {
        const b = $('favp-' + c.id);
        if (!b) return;
        const o = $('so-' + c.id).selectedIndex, d = $('sd-' + c.id).selectedIndex;
        const on = LS.getJ('favPares', []).some(x => x.c === c.id && x.o === o && x.d === d);
        b.textContent = on ? tx('parGuardado') : tx('guardarPar');
    }

    /* ===================== PULGADAS / PIES ===================== */
    function gcd(a, b) { while (b) { const t = b; b = a % b; a = t; } return a; }

    function buildImp(c) {
        const id = c.id, feet = c.feet;
        const precs = [['dec']].concat(feet ? [[1]] : []).concat([[2], [4], [8], [16], [32], [64]]);
        const radios = precs.map(p => {
            const v = p[0];
            const lab = v === 'dec' ? '<span data-i="decimales"></span>' : v === 1 ? '<span data-i="pulgada"></span>' : '<span>1/' + v + ' "</span>';
            return '<label><input type="radio" name="prec-' + id + '" value="' + v + '"' + (v === 64 ? ' checked' : '') + '>' + lab + '</label>';
        }).join('');
        const NI = (i, extra) => '<input class="num" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" id="' + i + '" placeholder="' + (extra || '0') + '">';
        const div = document.createElement('div');
        div.className = 'tab-content';
        div.id = 'tab-' + id;
        div.innerHTML =
            '<fieldset class="adjust"><legend data-i="ajustar"></legend><div class="radios">' + radios + '</div></fieldset>' +
            '<div class="imp-grid">' +
              '<div class="box"><h3 data-i="' + (feet ? 'pies' : 'pulgadas') + '"></h3>' +
                '<div class="imp-fields">' +
                  (feet ? '<div class="fg"><label for="ft-' + id + '" data-i="pies"></label>' + NI('ft-' + id) + '</div>' : '') +
                  '<div class="fg"><label for="wh-' + id + '" data-i="' + (feet ? 'pulgadas' : 'parteEntera') + '"></label>' + NI('wh-' + id) + '</div>' +
                  '<div class="fg"><label data-i="fraccion"></label><div class="frac">' + NI('nu-' + id) + '<div class="bar"></div>' + NI('de-' + id, '1') + '</div></div>' +
                '</div>' +
                '<div class="nav"><button type="button" class="btn btn-secondary" id="prev-' + id + '">◀ <span data-i="ant"></span></button><button type="button" class="btn btn-secondary" id="next-' + id + '"><span data-i="sig"></span> ▶</button></div>' +
              '</div>' +
              '<div class="box"><h3 data-i="' + (feet ? 'centimetros' : 'milimetros') + '"></h3>' +
                '<div class="fg">' + NI('out-' + id) + '</div>' +
                (feet ? '<div class="radios out-units"><label><input type="radio" name="ou-' + id + '" value="1000">m</label><label><input type="radio" name="ou-' + id + '" value="10" checked>cm</label><label><input type="radio" name="ou-' + id + '" value="1">mm</label></div>' : '') +
              '</div>' +
            '</div>' +
            '<div class="note" id="note-' + id + '"></div>';
        $('tabs').appendChild(div);

        const st = { N: 64, div: feet ? 10 : 1 };
        const g = k => $(k + '-' + id);

        function readFields() {
            const keys = feet ? ['ft', 'wh', 'nu', 'de'] : ['wh', 'nu', 'de'];
            if (keys.every(k => g(k).value.trim() === '')) return null;
            const ft = feet ? numOf(g('ft')) : 0;
            const wh = numOf(g('wh'));
            const nu = numOf(g('nu'));
            let de = numOf(g('de')) || 1;
            if (de === 0) de = 1;
            return ft * 12 + wh + nu / de;
        }
        function writeFields(inches) {
            inches = Math.max(0, inches);
            let ft = 0, wh, nu = 0, de = 1;
            if (st.N === 0) {
                if (feet) { ft = Math.floor(inches / 12 + 1e-12); wh = inches - ft * 12; } else wh = inches;
                wh = Number(wh.toPrecision(10));
                if (feet && wh >= 12) { ft++; wh -= 12; }
            } else {
                const Nn = st.N, Un = Math.round(inches * Nn + 1e-9), per = 12 * Nn;
                if (feet) ft = Math.floor(Un / per);
                const r = Un - (feet ? ft * per : 0);
                wh = Math.floor(r / Nn);
                nu = r - wh * Nn;
                if (nu) { const gg = gcd(nu, Nn); nu /= gg; de = Nn / gg; }
            }
            if (feet) g('ft').value = ft;
            g('wh').value = loc(String(wh));
            g('nu').value = nu;
            g('de').value = de;
            ['ft', 'wh', 'nu', 'de'].forEach(k => g(k) && g(k).classList.remove('bad'));
        }
        function setOut(inches) { g('out').value = inches === null ? '' : fmtNum(inches * 25.4 / st.div); g('out').classList.remove('bad'); }
        function updateNote(exactInches) {
            const lab = st.N === 0 ? UI[lang].decimales : (st.N === 1 ? '1"' : '1/' + st.N + '"');
            let txt = UI[lang].precision + ' ' + lab;
            if (exactInches !== null && st.N !== 0) {
                const r = readFields();
                if (r !== null) {
                    const err = (r - exactInches) * 25.4;
                    if (Math.abs(err) > 1e-9) txt += '  ·  ' + UI[lang].ajuste + ' ' + (err > 0 ? '+' : '') + fmtNum(err) + ' mm';
                }
            }
            g('note').innerHTML = txt + '<br>' + UI[lang].nota;
        }
        function onFields() { ['ft', 'wh', 'nu', 'de'].forEach(k => g(k) && markBad(g(k))); const inches = readFields(); setOut(inches); updateNote(null); }
        function onOut() {
            markBad(g('out'));
            const v = V(g('out'));
            if (isNaN(v)) { ['ft', 'wh', 'nu', 'de'].forEach(k => { if (g(k)) g(k).value = ''; }); updateNote(null); return; }
            const inches = v * st.div / 25.4;
            writeFields(inches);
            updateNote(inches);
        }
        function step(dir) {
            const base = readFields() || 0;
            const inches = st.N === 0 ? base + dir * 0.01 : (Math.round(base * st.N) + dir) / st.N;
            writeFields(inches);
            setOut(readFields());
            updateNote(null);
        }
        function refit() {
            let inches;
            const v = V(g('out'));
            if (!isNaN(v)) inches = v * st.div / 25.4; else inches = readFields();
            if (inches === null) { updateNote(null); return; }
            writeFields(inches);
            updateNote(inches);
        }

        ['ft', 'wh', 'nu', 'de'].forEach(k => { if (g(k)) g(k).addEventListener('input', onFields); });
        g('out').addEventListener('input', onOut);
        g('prev').addEventListener('click', () => step(-1));
        g('next').addEventListener('click', () => step(1));
        div.querySelectorAll('input[name="prec-' + id + '"]').forEach(r => r.addEventListener('change', () => {
            st.N = r.value === 'dec' ? 0 : parseInt(r.value);
            refit();
        }));
        div.querySelectorAll('input[name="ou-' + id + '"]').forEach(r => r.addEventListener('change', () => {
            const cur = readFields();
            st.div = parseInt(r.value);
            if (cur !== null) setOut(cur);
        }));
        c.imp = {
            clear() { ['ft', 'wh', 'nu', 'de', 'out'].forEach(k => { if (g(k)) g(k).value = ''; }); updateNote(null); g(feet ? 'ft' : 'wh').focus(); },
            note() { updateNote(null); },
            refresh() { const cur = readFields(); if (cur !== null) setOut(cur); updateNote(null); }
        };
    }

    /* ===================== ZAPATOS ===================== */
    function fracTxt(s) { return s ? s.replace(/ 1\/2/g, '½').replace(/ 1\/4/g, '¼').replace(/ 3\/4/g, '¾').replace(/ - /g, ' – ') : '–'; }
    function buildShoes(c) {
        const div = document.createElement('div');
        div.className = 'tab-content';
        div.id = 'tab-' + c.id;
        const rows = SHOES.map(r => '<tr><th>' + r[0] + '</th><td>' + fracTxt(r[1]) + '</td><td>' + fracTxt(r[2]) + '</td><td>' + fracTxt(r[3]) + '</td></tr>').join('');
        div.innerHTML = '<div class="shoe-wrap"><table class="shoes"><thead><tr><th data-i="zEU"></th><th data-i="zMuj"></th><th data-i="zHom"></th><th data-i="zCm"></th></tr></thead><tbody>' + rows + '</tbody></table></div>';
        $('tabs').appendChild(div);
        div.querySelectorAll('tbody tr').forEach(tr => tr.addEventListener('click', () => {
            const was = tr.classList.contains('sel');
            div.querySelectorAll('tr.sel').forEach(x => x.classList.remove('sel'));
            if (!was) tr.classList.add('sel');
        }));
    }

    /* ===================== CALCULADORAS ===================== */
    function onNums(div, fn) {
        div.querySelectorAll('input.num:not([readonly])').forEach(el => el.addEventListener('input', () => { markBad(el); fn(el); }));
        div.querySelectorAll('select').forEach(el => el.addEventListener('change', () => fn(el)));
    }
    function mkDiv(c, html) {
        const div = document.createElement('div');
        div.className = 'tab-content'; div.id = 'tab-' + c.id; div.innerHTML = html;
        $('tabs').appendChild(div);
        return div;
    }

    /* --- Electricidad --- */
    function buildElectrica(c) {
        const div = mkDiv(c,
            '<div class="calc-grid">' + S('el-sis', 'eSis', O('1', 'eMono') + O('3', 'eTri')) + F('el-v', 'eV', '400') + F('el-cos', 'eCos', '0.9') +
            F('el-i', 'eI') + F('el-p', 'eP') + F('el-s', 'eS') + F('el-q', 'eQ', undefined, true) + '</div><div class="note" data-t="eNota"></div>');
        $('el-sis').value = '3';
        let last = 'i';
        const e = id => $(id);
        function recalc() {
            const Vv = V(e('el-v')), cs = V(e('el-cos')), kk = e('el-sis').value === '3' ? Math.sqrt(3) : 1;
            const clear = () => { ['el-i', 'el-p', 'el-s'].forEach(x => { if (x !== 'el-' + last) e(x).value = ''; }); e('el-q').value = ''; };
            if (!(Vv > 0) || !(cs > 0 && cs <= 1)) { clear(); return; }
            let Sk;
            if (last === 'i') { const I = V(e('el-i')); if (isNaN(I)) { clear(); return; } Sk = kk * Vv * I / 1000; }
            else if (last === 'p') { const P = V(e('el-p')); if (isNaN(P)) { clear(); return; } Sk = P / cs; }
            else { Sk = V(e('el-s')); if (isNaN(Sk)) { clear(); return; } }
            if (last !== 'i') setO(e('el-i'), Sk * 1000 / (kk * Vv));
            if (last !== 'p') setO(e('el-p'), Sk * cs);
            if (last !== 's') setO(e('el-s'), Sk);
            setO(e('el-q'), Sk * Math.sqrt(1 - cs * cs));
        }
        onNums(div, el => { if (el.id === 'el-i') last = 'i'; else if (el.id === 'el-p') last = 'p'; else if (el.id === 'el-s') last = 's'; recalc(); });
        c.recalc = recalc;
    }

    /* --- Gases --- */
    const GASES = [['CO₂', 44.01], ['CO', 28.01], ['O₂', 32.00], ['NO', 30.01], ['NO₂', 46.01], ['SO₂', 64.07], ['NH₃', 17.03], ['H₂S', 34.08], ['CH₄', 16.04], ['O₃', 48.00], ['HCHO', 30.03], ['Cl₂', 70.90]];
    function buildGases(c) {
        const opts = GASES.map((g, i) => '<option value="' + g[1] + '">' + g[0] + '</option>').join('') + O('custom', 'gOtro');
        const div = mkDiv(c,
            '<div class="calc-grid">' + S('ga-gas', 'gGas', opts) + F('ga-m', 'gM', '44.01') + F('ga-t', 'gT', '25') + F('ga-p', 'gP', '101.325') +
            F('ga-ppm', 'gPpm') + F('ga-mg', 'gMg') + F('ga-ug', 'gUg') + F('ga-pct', 'gPct') + '</div><div class="note" data-t="gNota"></div>');
        let last = 'ppm';
        function recalc() {
            const M = V($('ga-m')), T = V($('ga-t')), P = V($('ga-p'));
            const others = { ppm: 'ga-ppm', mg: 'ga-mg', ug: 'ga-ug', pct: 'ga-pct' };
            const clear = () => Object.keys(others).forEach(k => { if (k !== last) $(others[k]).value = ''; });
            if (!(M > 0) || isNaN(T) || !(P > 0) || T <= -273.15) { clear(); return; }
            const Vm = 8.314462618 * (T + 273.15) / P;      // L/mol
            const src = V($(others[last]));
            if (isNaN(src)) { clear(); return; }
            let ppm;
            if (last === 'ppm') ppm = src; else if (last === 'mg') ppm = src * Vm / M; else if (last === 'ug') ppm = src / 1000 * Vm / M; else ppm = src * 1e4;
            const mg = ppm * M / Vm;
            if (last !== 'ppm') setO($('ga-ppm'), ppm);
            if (last !== 'mg') setO($('ga-mg'), mg);

            if (el.id === 'ga-m') $('ga-gas').value = 'custom';

    TX.gPpm = N('ppm (vol)', 'ppm (vol)', 'ppm (vol)', 'ppm (vol)', 'ppm (부피)');
    TX.gMg = N('mg/m³', 'mg/m³', 'mg/m³', 'mg/m³', 'mg/m³');

    /* --- Caudal normal ↔ real --- */
    function buildNormal(c) {

    /* --- Másico ↔ volumétrico --- */
    const FLUIDOS = [['fl_agua4', 1000], ['fl_agua20', 998.2], ['fl_agua60', 983.2], ['fl_mar', 1025], ['fl_aire20', 1.204], ['fl_aire15', 1.225], ['fl_gasoleo', 840], ['fl_aceite', 870], ['fl_hg', 13595.1]];
    const MASS_UNITS = [['kg/s', 1], ['kg/min', 1 / 60], ['kg/h', 1 / 3600], ['t/h', 1000 / 3600], ['lb/s', 0.45359237], ['lb/h', 0.45359237 / 3600]];

            if (last === 'm') { const m = V($('mv-m')); if (isNaN(m)) { $('mv-v').value = ''; return; } setO($('mv-v'), m * mu / rho / vu); }

    /* --- Presión ↔ columna de fluido --- */
    const LEN_UNITS = [['m', 1], ['mm', 0.001], ['cm', 0.01], ['in', 0.0254], ['ft', 0.3048]];
    const PRES_UNITS = [['Pa', 1], ['kPa', 1000], ['bar', 1e5], ['mbar', 100], ['psi', 6894.757293168], ['atm', 101325], ['kgf/cm²', 98066.5]];
    function buildColumna(c) {
        const fl = FLUIDOS.filter(f => f[0] !== 'fl_aire15').map(f => O(f[1], f[0])).join('') + O('custom', 'gOtro');
        const div = mkDiv(c,

            if (last === 'h') { const h = V($('co-h')); if (isNaN(h)) { $('co-p').value = ''; return; } setO($('co-p'), rho * g * h * hu / pu); }

    /* --- Psicrometría --- */
    function pws(Tc) {   // kPa, Hyland-Wexler (ASHRAE)
        const T = Tc + 273.15;
        let l;
        if (Tc < 0) l = -5.6745359e3 / T + 6.3925247 - 9.677843e-3 * T + 6.2215701e-7 * T * T + 2.0747825e-9 * Math.pow(T, 3) - 9.484024e-13 * Math.pow(T, 4) + 4.1635019 * Math.log(T);
        else l = -5.8002206e3 / T + 1.3914993 - 4.8640239e-2 * T + 4.1764768e-5 * T * T - 1.4452093e-8 * Math.pow(T, 3) + 6.5459673 * Math.log(T);
        return Math.exp(l) / 1000;
    }
    function psy(T, RH, P) {
        const Pw = pws(T), Pv = RH / 100 * Pw;
        if (!(Pv < P) || RH < 0) return null;
        const W = 0.621945 * Pv / (P - Pv);
        const h = 1.006 * T + W * (2501 + 1.86 * T);
        const v = 0.287042 * (T + 273.15) * (1 + 1.607858 * W) / P;
        let Td = NaN;
        if (Pv > pws(-80)) {
            let lo = -80, hi = Math.max(T, -79);
            for (let k = 0; k < 80; k++) { const mid = (lo + hi) / 2; if (pws(mid) < Pv) lo = mid; else hi = mid; }
            Td = (lo + hi) / 2;
        }
        let Twb = NaN;
        if (T >= 0 && !isNaN(Td)) {
            const wwb = tw => { const ws = 0.621945 * pws(tw) / (P - pws(tw)); return ((2501 - 2.326 * tw) * ws - 1.006 * (T - tw)) / (2501 + 1.86 * T - 4.186 * tw); };
            let lo = Td, hi = T;
            for (let k = 0; k < 80; k++) { const mid = (lo + hi) / 2; if (wwb(mid) < W) lo = mid; else hi = mid; }
            Twb = (lo + hi) / 2;
        }
        return { Pw, Pv, W: W * 1000, h, v, rho: (1 + W) / v, Td, Twb };
    }
    function buildPsicro(c) {
        const div = mkDiv(c,
            '<div class="calc-grid">' + F('ps-t', 'pT', '25') + F('ps-hr', 'pHR', '50') + F('ps-p', 'pP', '101.325') + F('ps-alt', 'pAlt') + '</div>' +

            '<div class="note" data-t="pNota"></div>');
        function recalc() {
            const T = V($('ps-t')), RH = V($('ps-hr')), P = V($('ps-p'));
            const ids = ['po-pws', 'po-pv', 'po-w', 'po-h', 'po-td', 'po-twb', 'po-v', 'po-rho'];
            const r = (isNaN(T) || isNaN(RH) || !(P > 0) || T < -80 || T > 200) ? null : psy(T, RH, P);
            if (!r) { ids.forEach(i => $(i).textContent = ''); return; }
            const put = (i, x, d) => { $(i).textContent = isFinite(x) ? (FMT.mode === 'auto' ? fmtNum(Number(x.toFixed(d))) : fmtNum(x)) : '–'; };
            put('po-pws', r.Pw, 4); put('po-pv', r.Pv, 4); put('po-w', r.W, 3); put('po-h', r.h, 3); put('po-td', r.Td, 2); put('po-twb', r.Twb, 2); put('po-v', r.v, 4); put('po-rho', r.rho, 4);
        }

            }

    /* ===================== v3: DATOS Y CALCULADORAS TÉCNICAS ===================== */

    const fx = (x, d) => (x === null || x === undefined || !isFinite(x)) ? '–' : (FMT.mode === 'auto' ? fmtNum(Number(x.toFixed(d))) : fmtNum(x));

    /* rellena un <select> solo si cambió el idioma o la lista (conserva la selección) */
    function setOpts(sel, arr, force) {

        $('fr-fl').value = '0';

            const target = ['q', 'v', 'dt'].filter(k => order.indexOf(k) < 0)[0];

    const HRB_T = [[83, 159, 159], [84, 162, 162], [85, 165, 165], [86, 169, 169], [87, 172, 172], [88, 176, 176], [89, 180, 180], [90, 186, 186], [91, 190, 190], [92, 195, 195], [93, 200, 200], [94, 205, 205], [95, 210, 210], [96, 216, 216], [97, 222, 222], [98, 228, 228], [99, 234, 234], [100, 240, 240]];
    function lin(xs, ys, x) {
        if (isNaN(x) || x < xs[0] || x > xs[xs.length - 1]) return null;
        let i = 0; while (i < xs.length - 2 && x > xs[i + 1]) i++;
        const t = (x - xs[i]) / (xs[i + 1] - xs[i]);

        engFromCst: v => (v + Math.sqrt(v * v + 4 * 7.32 * 6.31)) / (2 * 7.32),
        cstFromEng: e => 7.32 * e - 6.31 / e,

    function buildAutotest(c) {
        const div = mkDiv(c,
            '<div class="actions-row"><button type="button" class="btn" id="at-run" data-t="atRun"></button><button type="button" class="btn btn-secondary" id="at-copy" data-t="atCopy"></button></div>' +
            '<div class="note" data-t="atNota"></div><div class="at-sum" id="at-sum"></div>' +
            '<details class="all" id="at-det"><summary data-t="atRes"></summary><div class="shoe-wrap"><table class="shoes dt" id="at-tab"><thead><tr><th data-t="atGrupo"></th><th>Test</th><th data-t="atRes"></th></tr></thead><tbody id="at-body"></tbody></table></div></details>');
        let report = '';
        function run() {
            const r = runSelfTest();
            const body = $('at-body'); body.innerHTML = '';
            const rows = r.tests.filter(x => !x.ok).concat(r.tests.filter(x => x.ok));
            rows.forEach(x => {
                const tr = document.createElement('tr');
                tr.innerHTML = '<th style="font-size:.75rem">' + x.g + '</th><td style="text-align:left">' + x.name.replace(/</g, '&lt;') + '</td><td style="text-align:left;color:' + (x.ok ? '#16a34a' : '#dc2626') + ';font-weight:700">' + (x.ok ? '✓' : '✗ ' + x.d.replace(/</g, '&lt;')) + '</td>';
                body.appendChild(tr);
            });
            const s = $('at-sum');
            s.textContent = (r.fail === 0 ? tx('atOk') : tx('atKo') + ': ' + r.fail) + '  —  ' + r.pass + ' / ' + r.tests.length + ' ' + tx('atPruebas');
            s.style.color = r.fail === 0 ? '#16a34a' : '#dc2626';
            $('at-det').open = r.fail > 0;
            report = s.textContent + '\n' + rows.map(x => (x.ok ? 'OK   ' : 'FAIL ') + '[' + x.g + '] ' + x.name + (x.ok ? '' : ' → ' + x.d)).join('\n');
            return r;
        }
        $('at-run').addEventListener('click', run);
        $('at-copy').addEventListener('click', () => copiar(report || '', $('at-copy')));
        c.run = run;
    }

        LS.set('idiomaPrefijo', l);
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
        CATS.forEach(c => { if (isGeneric(c)) poblarSelects(c); });
        actualizarTextos();
        buildManualRatesLabels();
        refreshAll();
    }

    function aplicarFormato() {
        const v = $('fmtSelect').value;
        if (v === 'auto') { FMT.mode = 'auto'; FMT.dec = 0; }
        else if (v === 'sci') { FMT.mode = 'sci'; FMT.dec = 4; }
        else { FMT.mode = 'dec'; FMT.dec = parseInt(v.slice(1)); }
        LS.set('formatoConv', v);
        refreshAll();
    }

    const mqDark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    function aplicarTema() {
        let tema = $('themeSelect').value;
        const efectivo = tema === 'auto' ? (mqDark && mqDark.matches ? 'dark' : 'light') : tema;
        if (efectivo === 'light') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', efectivo);
        LS.set('temaConversor', tema);
        const pc = getComputedStyle(document.documentElement).getPropertyValue('--primary-color').trim();
        $('metaTheme').setAttribute('content', pc || '#1e3a8a');
    }

    const FS_STEPS = [0.9, 1, 1.15, 1.3];
    let fsIdx = 1;
    function aplicarFs() {
        document.documentElement.style.setProperty('--fs', FS_STEPS[fsIdx]);
        LS.set('fsConv', String(fsIdx));
    }

    function switchTab(id) {
        if (!byId[id]) return;
        activa = id;
        const c = byId[id];
        document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.toggle('active', b.dataset.id === id && !b.classList.contains('fav')));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.toggle('active', t.id === 'tab-' + id));
        $('catSelect').value = id;
        $('footerActions').style.display = c.type === 'shoes' ? 'none' : '';
        $('histPanel').style.display = isGeneric(c) ? '' : 'none';
        LS.set('ultimaCat', id);
        actualizarCabecera();
        const favs = LS.getJ('favCats', []);
        $('btnFavCat').textContent = favs.indexOf(id) >= 0 ? '★' : '☆';
        const act = document.querySelector('.sidebar-btn.active');
        if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest' });
    }

    function limpiar() {
        const c = byId[activa];
        if (c.type === 'imp') { c.imp.clear(); return; }
        if (c.type === 'shoes') return;
        if (c.type === 'calc') {
            $('tab-' + c.id).querySelectorAll('input.num, input.txt').forEach(i => { i.value = ''; i.classList.remove('bad'); });
            $('tab-' + c.id).querySelectorAll('.out-item .v').forEach(v => v.textContent = '');
            if (c.recalc) c.recalc();
            return;
        }
        $('val-' + c.id).value = '';
        calcular(c);
        $('val-' + c.id).focus();
    }

    /* ===================== DIVISAS ===================== */
    let estadoDivisas = 'def', fechaDivisas = '', liveRates = null;
    let manual = LS.getJ('divisasManual', { use: false, rates: {} });

    function tasasActuales() {
        if (manual.use && DIVISAS_COD.every(k => manual.rates[k] > 0)) return { r: manual.rates, e: 'man' };
        return { r: liveRates || DIVISAS_FALLBACK, e: estadoDivisas };
    }
    function aplicarTasas() {
        const t = tasasActuales();
        CAT_DIV.units.forEach((un, i) => { un.f = 1 / t.r[DIVISAS_COD[i]]; });
        calcular(CAT_DIV);
        actualizarEstadoDivisas();
    }
    function actualizarEstadoDivisas() {
        const el = $('currencyStatus');
        if (!el) return;
        const t = UI[lang], e = tasasActuales().e;
        if (e === 'man') el.textContent = t.cambioMan;
        else if (e === 'live') el.textContent = t.cambioOk + fechaDivisas + ')';
        else if (e === 'cache') el.textContent = t.cambioCache + fechaDivisas + ')';
        else el.textContent = t.cambioDef;
    }
    function buildManualRatesGrid() {
        const grid = $('mr-grid');
        grid.innerHTML = DIVISAS_COD.map(k => '<div class="fg"><label for="mr-' + k + '"></label><input class="num" type="text" inputmode="decimal" autocomplete="off" id="mr-' + k + '"></div>').join('');
        $('mr-use').checked = !!manual.use;
        DIVISAS_COD.forEach(k => {
            const inp = $('mr-' + k);
            if (manual.rates[k] > 0) inp.value = String(manual.rates[k]).replace('.', LANGS_COMMA.indexOf(lang) >= 0 ? ',' : '.');
            inp.addEventListener('input', () => {
                markBad(inp);
                const v = V(inp);
                if (v > 0) manual.rates[k] = v; else delete manual.rates[k];
                LS.setJ('divisasManual', manual);
                aplicarTasas();
            });
        });
        $('mr-use').addEventListener('change', () => {
            manual.use = $('mr-use').checked;
            if (manual.use) {   // rellena los huecos con la tasa actual
                const base = liveRates || DIVISAS_FALLBACK;
                DIVISAS_COD.forEach(k => { if (!(manual.rates[k] > 0)) { manual.rates[k] = base[k]; $('mr-' + k).value = rawStr(base[k]); } });
            }
            LS.setJ('divisasManual', manual);
            aplicarTasas();
        });
    }
    function buildManualRatesLabels() {
        DIVISAS_COD.forEach(k => { const l = document.querySelector('label[for="mr-' + k + '"]'); if (l) l.textContent = '1 USD = ? ' + k; });
    }
    async function obtenerTiposDeCambio() {
        try {
            const cache = JSON.parse(LS.get('divisasCache') || 'null');
            if (cache && cache.rates && DIVISAS_COD.every(k => cache.rates[k] > 0)) {
                liveRates = cache.rates; estadoDivisas = 'cache'; fechaDivisas = cache.fecha || '';
            }
        } catch (e) { }
        aplicarTasas();
        try {
            const resp = await fetch('https://open.er-api.com/v6/latest/USD');
            const data = await resp.json();
            if (data && data.rates && DIVISAS_COD.every(k => data.rates[k] > 0)) {
                const r = {}; DIVISAS_COD.forEach(k => r[k] = data.rates[k]);
                liveRates = r; estadoDivisas = 'live';
                fechaDivisas = (data.time_last_update_utc || '').substring(0, 16);
                LS.setJ('divisasCache', { rates: r, fecha: fechaDivisas });
                DIVISAS_COD.forEach(k => { const i = $('mr-' + k); if (i) i.placeholder = rawStr(r[k]); });
            }
        } catch (e) { /* se mantiene caché o valores aproximados */ }
        aplicarTasas();
    }

    /* ===================== BARRA DE TECLAS (táctil) ===================== */
    function initKeybar() {
        const touch = window.matchMedia && window.matchMedia('(hover: none)').matches;
        if (!touch) return;
        const keybar = document.createElement('div');
        keybar.className = 'keybar';
        [['−', '-'], ['+', '+'], ['×', '*'], ['÷', '/'], ['(', '('], [')', ')'], ['␣', ' '], ['⌫', 'BS']].forEach(k => {
            const b = document.createElement('button'); b.type = 'button'; b.textContent = k[0]; b.dataset.k = k[1]; keybar.appendChild(b);
        });
        let active = null;
        const keep = e => e.preventDefault();
        keybar.addEventListener('mousedown', keep);
        keybar.addEventListener('touchstart', keep, { passive: false });
        keybar.addEventListener('click', e => {
            const b = e.target.closest('button');
            if (!b || !active) return;
            const k = b.dataset.k, s = active.selectionStart != null ? active.selectionStart : active.value.length, en = active.selectionEnd != null ? active.selectionEnd : s;
            let v = active.value, pos;
            if (k === 'BS') {
                if (s !== en) { v = v.slice(0, s) + v.slice(en); pos = s; }
                else if (s > 0) { v = v.slice(0, s - 1) + v.slice(s); pos = s - 1; } else return;
            } else { v = v.slice(0, s) + k + v.slice(en); pos = s + k.length; }
            active.value = v;
            try { active.setSelectionRange(pos, pos); } catch (err) { }
            active.dispatchEvent(new Event('input', { bubbles: true }));
        });
        document.addEventListener('focusin', e => {
            const t = e.target;
            if (t && t.classList && t.classList.contains('num') && !t.readOnly) {
                active = t;
                const host = t.closest('.fg, .form-group') || t.parentNode;
                host.appendChild(keybar);
                keybar.style.display = 'flex';
            }
        });
        document.addEventListener('focusout', () => {
            setTimeout(() => {
                const a = document.activeElement;
                if (!a || !a.classList || !a.classList.contains('num')) keybar.style.display = 'none';
            }, 200);
        });
    }

    /* ===================== INICIO ===================== */
    function inicializar() {
        CATS.forEach(c => {
            if (c.type === 'imp') buildImp(c);
            else if (c.type === 'shoes') buildShoes(c);
            else if (c.type === 'calc') CALC_BUILDERS[c.id](c);
            else buildGeneric(c);
        });
        buildManualRatesGrid();

        document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => cambiarIdioma(b.dataset.lang)));
        $('themeSelect').addEventListener('change', aplicarTema);
        $('fmtSelect').addEventListener('change', aplicarFormato);
        if (mqDark && mqDark.addEventListener) mqDark.addEventListener('change', () => { if ($('themeSelect').value === 'auto') aplicarTema(); });
        $('btnClear').addEventListener('click', limpiar);
        $('btnClose').addEventListener('click', () => window.close());
        $('catSelect').addEventListener('change', () => switchTab($('catSelect').value));
        $('fsUp').addEventListener('click', () => { if (fsIdx < FS_STEPS.length - 1) { fsIdx++; aplicarFs(); } });
        $('fsDown').addEventListener('click', () => { if (fsIdx > 0) { fsIdx--; aplicarFs(); } });
        $('btnFavCat').addEventListener('click', () => {
            let favs = LS.getJ('favCats', []);
            const k = favs.indexOf(activa);
            if (k >= 0) favs.splice(k, 1); else favs.unshift(activa);
            LS.setJ('favCats', favs);
            renderMenus();
        });

        const idiomaGuardado = LS.get('idiomaPrefijo');
        if (idiomaGuardado && UI[idiomaGuardado]) lang = idiomaGuardado;
        const temaGuardado = LS.get('temaConversor');
        if (['medium', 'dark', 'auto'].indexOf(temaGuardado) >= 0) $('themeSelect').value = temaGuardado;
        const fsG = parseInt(LS.get('fsConv'));
        if (fsG >= 0 && fsG < FS_STEPS.length) fsIdx = fsG;
        aplicarFs();
        const fmtG = LS.get('formatoConv');
        if (fmtG && Array.from($('fmtSelect').options).some(o => o.value === fmtG)) $('fmtSelect').value = fmtG;
        aplicarTema();

        const params = new URLSearchParams(location.search);
        const qcat = params.get('cat');
        const ultima = LS.get('ultimaCat');
        if (qcat && byId[qcat]) activa = qcat; else if (ultima && byId[ultima]) activa = ultima;

        CATS.forEach(c => { if (isGeneric(c)) poblarSelects(c); });
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
        actualizarTextos();
        buildManualRatesLabels();
        switchTab(activa);
        const fv = $('fmtSelect').value;
        if (fv !== 'auto') aplicarFormato(); else refreshAll();
        initKeybar();
        obtenerTiposDeCambio();

        if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
            navigator.serviceWorker.register('sw.js').catch(() => { });
        }
    }

    window.addEventListener('DOMContentLoaded', inicializar);
})();
</script>
